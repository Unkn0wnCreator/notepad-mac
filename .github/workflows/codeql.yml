name: codeql

# CodeQL for the Swift sources. CodeQL has no Objective-C support, so PlainTextStorage.m is
# covered by the clang static analyzer step in ci.yml instead. Swift analysis needs macOS and a
# traced build; it is slow, so it runs on main and weekly rather than on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build
        run: ./build.sh

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
