name: codeql

# CodeQL for the Swift sources and the workflow files. CodeQL has no Objective-C support, so
# PlainTextStorage.m is covered by the clang static analyzer step in ci.yml instead. Swift analysis
# needs macOS and a traced build (there is no Xcode project, so GitHub's "default setup" cannot
# build it – this advanced setup replaces it, and the default setup must stay disabled). It is
# slow, so it runs on main and weekly rather than on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-latest
            build-mode: manual
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.build-mode == 'manual'
        run: ./build.sh

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
